<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#9a1c1c" />
<title>Mesa Fire &amp; Medical — Station Coverage &amp; Buildout Plan</title>
<meta name="description" content="Interactive response-time coverage analysis and data-driven siting plan for future Mesa Fire & Medical Department stations." />
<link rel="preconnect" href="https://unpkg.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">
  <div id="map" aria-label="Map of Mesa fire station coverage"></div>

  <!-- Top bar -->
  <header id="topbar">
    <div class="brand">
      <span class="shield" aria-hidden="true">🚒</span>
      <div class="brand-txt">
        <h1>Mesa Fire &amp; Medical</h1>
        <p>Station Coverage &amp; Buildout Plan</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="editToggle" class="btn-pill" title="Edit stations">✎ Edit</button>
      <button id="helpBtn" class="btn-pill ghost" title="Help, FAQ &amp; methodology">？ Help</button>
    </div>
  </header>

  <!-- Phase + lens (top center) -->
  <div id="controlStack">
    <div id="phaseBar" role="tablist" aria-label="Build phase">
      <button class="phase active" data-phase="funded" role="tab">Current<small>22 + 223/224</small></button>
      <button class="phase" data-phase="bond2028" role="tab">+ 2028 Bond<small>225 &amp; 226</small></button>
      <button class="phase" data-phase="buildout" role="tab">Full Buildout<small>+227–230</small></button>
    </div>
    <div id="lensBar" role="group" aria-label="Planning lens">
      <span class="lens-lbl">Lens</span>
      <button class="lensbtn active" data-strat="mesa">Mesa only</button>
      <button class="lensbtn" data-strat="aid">+ Mutual aid</button>
    </div>
    <div id="buildoutStepper" class="hidden" role="group" aria-label="Buildout station count">
      <span class="lens-lbl">Buildout</span>
      <button class="bs-btn" id="buildoutMinus" aria-label="Fewer buildout stations">−</button>
      <b id="buildoutCount">4</b>
      <button class="bs-btn" id="buildoutPlus" aria-label="More buildout stations">+</button>
      <span class="bs-sub">stations · live</span>
    </div>
  </div>

  <!-- Layers: FAB + collapsible panel -->
  <button id="layersBtn" title="Map layers" aria-label="Toggle map layers">▤</button>
  <div id="layersPanel" aria-label="Map layers">
    <div class="lp-head"><span>Map layers</span><button id="layersClose" aria-label="Close layers">✕</button></div>
    <div class="ctl-lbl">Base map</div>
    <div id="baseSeg" class="seg">
      <button class="segbtn active" data-base="map">Map</button>
      <button class="segbtn" data-base="sat">Satellite</button>
    </div>
    <div class="ctl-lbl">Coverage &amp; data</div>
    <label><input type="checkbox" id="band4" checked /> <span class="sw sw4"></span> 4-min engine</label>
    <label><input type="checkbox" id="band8" /> <span class="sw sw8"></span> 8-min full alarm</label>
    <label><input type="checkbox" id="gapsChk" /> <span class="sw swgap"></span> Coverage gaps</label>
    <label><input type="checkbox" id="devChk" /> <span class="sw swdev"></span> Planned developments</label>
    <label><input type="checkbox" id="popChk" /> <span class="sw swpop"></span> Population density</label>
    <label><input type="checkbox" id="islandChk" checked /> <span class="sw swisland"></span> County islands</label>
  </div>

  <!-- Edit toolbar (hidden until Edit mode) -->
  <div id="editBar" class="hidden" aria-label="Edit stations">
    <div class="live-readout">
      <div class="rd"><b id="live4">–</b><span>4-min area</span><i id="live4d">–</i></div>
      <div class="rd"><b id="live8">–</b><span>8-min area</span><i id="live8d">–</i></div>
      <div class="rd"><b id="liveN">–</b><span>stations shown</span></div>
    </div>
    <div class="edit-actions">
      <button id="addBtn" class="ebtn">➕ Add station</button>
      <button id="resetBtn" class="ebtn ghost">↺ Reset</button>
      <button id="warnBtn" class="ebtn ghost" aria-pressed="true">⚠︎ Warnings: On</button>
    </div>
    <div class="edit-hint" id="editHint">Drag the proposed (violet/pink) stations to move them • tap any station to delete</div>
  </div>

  <!-- Bottom / side panel -->
  <section id="panel" class="collapsed" aria-label="Analysis details">
    <button id="panelHandle" aria-label="Expand panel"><span></span></button>
    <nav id="panelTabs">
      <button class="ptab active" data-tab="overview">Overview</button>
      <button class="ptab" data-tab="stations">Stations</button>
      <button class="ptab" data-tab="why">Why here</button>
    </nav>
    <div id="panelBody">
      <div class="tabpane active" data-pane="overview"></div>
      <div class="tabpane" data-pane="stations"></div>
      <div class="tabpane" data-pane="why"></div>
    </div>
  </section>

  <div id="toast"></div>

  <!-- Help center: FAQ + Methodology -->
  <div id="modal" class="hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="modalClose" class="icon-btn" aria-label="Close">✕</button>
      <h2 id="helpTitle">Help &amp; methodology</h2>
      <div class="modal-tabs">
        <button class="mtab active" data-mtab="faq">FAQ</button>
        <button class="mtab" data-mtab="method">How it's built</button>
      </div>
      <div id="mFaq" class="mpane"></div>
      <div id="mMethod" class="mpane hidden"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/app.js"></script>
</body>
</html>
